<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON ARENA — Яндекс Игры</title>
<script src="/sdk.js"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#050811;font-family:'Segoe UI',sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:14px}
.bar{width:100%;height:12px;background:rgba(30,41,59,.8);border-radius:6px;overflow:hidden;margin-bottom:8px;border:1px solid rgba(56,189,248,.3)}
#xp{width:0%;height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:width .15s}
.hud{display:flex;justify-content:space-between;font-weight:bold;font-size:16px;text-shadow:0 2px 4px #000}
.ov{position:absolute;inset:0;background:rgba(5,8,17,.88);backdrop-filter:blur(5px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;z-index:10}
.hide{display:none!important}
h1{font-size:34px;background:linear-gradient(90deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
p{color:#94a3b8;margin-bottom:16px;font-size:14px;line-height:1.4}
.btn{background:linear-gradient(90deg,#0284c7,#6366f1);color:#fff;border:none;padding:15px 36px;font-size:17px;font-weight:bold;border-radius:14px;cursor:pointer;margin:6px}
.btn-ad{background:linear-gradient(90deg,#f59e0b,#ea580c);box-shadow:0 0 18px rgba(245,158,11,.4)}
.skins{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.sk{background:#1e293b;border:2px solid #334155;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:12px;min-width:75px}
.sk.on{border-color:#4ade80;background:#0f172a}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:350px}
.card{background:#1e293b;border:2px solid #38bdf8;padding:15px;border-radius:14px;cursor:pointer;text-align:left}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="hide">
  <div class="bar"><div id="xp"></div></div>
  <div class="hud">
    <span style="color:#f87171">❤️ <b id="hp">100</b></span>
    <span style="color:#38bdf8">УР. <b id="lvl">1</b></span>
    <span style="color:#facc15">🪙 <b id="cn">0</b></span>
  </div>
</div>
<div id="mStart" class="ov">
  <h1>NEON ARENA</h1>
  <p><b>ПК:</b> WASD / Стрелки или зажми мышь<br><b>Телефон / Планшет:</b> Веди пальцем<br><br>Монеты: <b id="totCn" style="color:#facc15">0</b> | Рекорд: <b id="best">0</b></p>
  <div class="skins" id="skBox"></div>
  <button class="btn" id="playBtn">В БОЙ!</button>
</div>
<div id="mUpg" class="ov hide">
  <h1>НОВЫЙ УРОВЕНЬ!</h1>
  <div class="cards" id="cards"></div>
</div>
<div id="mOver" class="ov hide">
  <h1 style="background:linear-gradient(90deg,#f87171,#ef4444);-webkit-background-clip:text">ИГРА ОКОНЧЕНА</h1>
  <p>Собрано за бой: <b id="endCn" style="color:#facc15;font-size:18px">0</b> 🪙</p>
  <button class="btn btn-ad" id="revBtn">📺 Возродиться (Реклама)</button>
  <button class="btn" id="menuBtn">В МЕНЮ</button>
</div>
<script>
let ysdk=null;
if(window.YaGames){
  YaGames.init().then(_y=>{
    ysdk=_y;
    ysdk.features.LoadingAPI?.ready();
  }).catch(()=>{});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;const res=()=>{W=c.width=innerWidth;H=c.height=innerHeight};onresize=res;res();
document.oncontextmenu=e=>e.preventDefault();

const ac=new(window.AudioContext||window.webkitAudioContext)();
function snd(f,t,d,v=.06){
  if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(20,ac.currentTime+d);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}

let sv=JSON.parse(localStorage.getItem('naSave2'))||{cn:0,best:0,un:['#38bdf8'],cur:'#38bdf8'};
const skins=[
  {col:'#38bdf8',nm:'Кибер',pr:0,b:'Баланс'},
  {col:'#4ade80',nm:'Токсик',pr:100,b:'+Скорость'},
  {col:'#c084fc',nm:'Плазма',pr:300,b:'+Урон'},
  {col:'#facc15',nm:'Титан',pr:700,b:'+Броня'}
];

function drawSkins(){
  document.getElementById('totCn').innerText=sv.cn;
  document.getElementById('best').innerText=sv.best;
  const b=document.getElementById('skBox');b.innerHTML='';
  skins.forEach(s=>{
    const ok=sv.un.includes(s.col),on=sv.cur===s.col;
    const d=document.createElement('div');
    d.className='sk'+(on?' on':'');
    d.innerHTML=`<div style="width:22px;height:22px;border-radius:50%;background:${s.col};margin:0 auto 5px"></div><b>${s.nm}</b><div style="font-size:10px;color:#94a3b8">${s.b}</div><div style="color:#facc15;margin-top:2px">${on?'Выбран':(ok?'Надеть':'🪙'+s.pr)}</div>`;
    d.onclick=()=>{
      if(ok){sv.cur=s.col;snd(500,'sine',.1)}
      else if(sv.cn>=s.pr){sv.cn-=s.pr;sv.un.push(s.col);sv.cur=s.col;snd(700,'sine',.25,.12)}
      else snd(140,'sawtooth',.15);
      localStorage.setItem('naSave2',JSON.stringify(sv));drawSkins();
    };
    b.appendChild(d);
  });
}

let st='menu',p,bul,enm,gem,prt,rc=0,shk=0,revUsed=0,keys={},joy={on:0,sx:0,sy:0,cx:0,cy:0,dx:0,dy:0};
onkeydown=e=>keys[e.code]=1;onkeyup=e=>keys[e.code]=0;

function startJoy(x,y){if(st==='play')joy={on:1,sx:x,sy:y,cx:x,cy:y,dx:0,dy:0}}
function moveJoy(x,y){
  if(!joy.on)return;joy.cx=x;joy.cy=y;
  const vx=x-joy.sx,vy=y-joy.sy,d=Math.hypot(vx,vy);
  if(d>6){joy.dx=vx/d;joy.dy=vy/d}else{joy.dx=0;joy.dy=0}
}
function endJoy(){joy.on=0;joy.dx=0;joy.dy=0}

c.addEventListener('touchstart',e=>{e.preventDefault();startJoy(e.touches.clientX,e.touches.clientY)},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e.touches.clientX,e.touches.clientY)},{passive:false});
c.addEventListener('touchend',endJoy);
c.addEventListener('mousedown',e=>startJoy(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>moveJoy(e.clientX,e.clientY));
window.addEventListener('mouseup',endJoy);

document.getElementById('playBtn').onclick=()=>{
  const isSpd=sv.cur==='#4ade80',isDmg=sv.cur==='#c084fc',isHp=sv.cur==='#facc15';
  p={x:W/2,y:H/2,r:16,hp:isHp?150:100,mhp:isHp?150:100,spd:isSpd?5.2:4.3,xp:0,mxp:40,lvl:1,fr:22,ft:0,bc:1,dmg:isDmg?35:25,orb:isHp?1:0,oa:0,mag:130};
  bul=[];enm=[];gem=[];prt=[];rc=0;shk=0;revUsed=0;st='play';endJoy();
  document.getElementById('mStart').classList.add('hide');
  document.getElementById('ui').classList.remove('hide');
  hud();snd(440,'triangle',.2);
};

// Возрождение игрока за просмотр видеорекламы Яндекс Игр
document.getElementById('revBtn').onclick=()=>{
  const doRevive=()=>{
    p.hp=p.mhp;enm=[];revUsed=1;st='play';
    document.getElementById('mOver').classList.add('hide');
    hud();snd(650,'sine',.3,.15);
  };
  if(ysdk){
    ysdk.adv.showRewardedVideo({callbacks:{onRewarded:doRevive,onError:doRevive}});
  }else{doRevive()}
};

// Переход в меню с показом обычной полноэкранной рекламы
document.getElementById('menuBtn').onclick=()=>{
  const goMenu=()=>{
    document.getElementById('mOver').classList.add('hide');
    document.getElementById('ui').classList.add('hide');
    document.getElementById('mStart').classList.remove('hide');
    drawSkins();
  };
  if(ysdk){
    ysdk.adv.showFullscreenAdv({callbacks:{onClose:goMenu,onError:goMenu}});
  }else{goMenu()}
};

const upgs=[
  {t:'🔫 +1 Пуля',d:'Стреляет веером',f:()=>p.bc++},
  {t:'⚡ Пулемет',d:'+25% к скорости стрельбы',f:()=>p.fr=Math.max(5,Math.floor(p.fr*.75))},
  {t:'💥 Плазма +20',d:'Увеличивает урон',f:()=>p.dmg+=20},
  {t:'🛡️ Энерго-щит',d:'Сфера режет врагов',f:()=>p.orb++},
  {t:'🧲 Супер-магнит',d:'Тянет кристаллы издалека',f:()=>p.mag+=120},
  {t:'❤️ Ремонт +60 HP',d:'Лечит и качает броню',f:()=>{p.mhp+=25;p.hp=Math.min(p.mhp,p.hp+60)}}
];

function lvlUp(){
  st='pause';endJoy();snd(600,'triangle',.3,.12);
  const box=document.getElementById('cards');box.innerHTML='';
  [...upgs].sort(()=>.5-Math.random()).slice(0,3).forEach(u=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<b style="color:#38bdf8;font-size:16px">${u.t}</b><br><span style="font-size:13px;color:#cbd5e1">${u.d}</span>`;
    d.onclick=()=>{u.f();document.getElementById('mUpg').classList.add('hide');st='play';hud()};
    box.appendChild(d);
  });
  document.getElementById('mUpg').classList.remove('hide');
}

function hud(){
  document.getElementById('hp').innerText=Math.ceil(p.hp);
  document.getElementById('lvl').innerText=p.lvl;
  document.getElementById('cn').innerText=rc;
  document.getElementById('xp').style.width=(p.xp/p.mxp*100)+'%';
}

let fr=0;
function loop(){
  requestAnimationFrame(loop);
  if(st!=='play')return;
  fr++;
  ctx.save();
  if(shk>0){ctx.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);shk*=.85;if(shk<.5)shk=0}

  ctx.fillStyle='#050811';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(56,189,248,.07)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;
  if(joy.on){mx=joy.dx;my=joy.dy}
  if(mx||my){const l=Math.hypot(mx,my);p.x=Math.max(16,Math.min(W-16,p.x+mx/l*p.spd));p.y=Math.max(16,Math.min(H-16,p.y+my/l*p.spd))}

  if(fr%Math.max(12,55-p.lvl*4)===0){
    const e=Math.floor(Math.random()*4),tk=Math.random()<.18&&p.lvl>=2;
    enm.push({x:e==1?W+20:(e==3?-20:Math.random()*W),y:e==0?-20:(e==2?H+20:Math.random()*H),r:tk?21:13,hp:(tk?85:25)+p.lvl*10,spd:tk?1.4:2+Math.min(1.6,p.lvl*.1),col:tk?'#a855f7':'#ef4444',val:tk?4:1});
  }

  p.ft++;
  if(p.ft>=p.fr&&enm.length){
    let nr=enm,md=1e9;
    enm.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<md){md=d;nr=e}});
    p.ft=0;snd(320,'square',.06,.025);
    const ba=Math.atan2(nr.y-p.y,nr.x-p.x);
    for(let i=0;i<p.bc;i++){
      const a=ba+(i-(p.bc-1)/2)*.18;
      bul.push({x:p.x,y:p.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,l:60});
    }
  }

  p.oa+=.07;const orbs=[];
  for(let i=0;i<p.orb;i++){
    const a=p.oa+i*Math.PI*2/p.orb,ox=p.x+Math.cos(a)*58,oy=p.y+Math.sin(a)*58;
    orbs.push({x:ox,y:oy});
    ctx.beginPath();ctx.arc(ox,oy,8,0,7);ctx.fillStyle=sv.cur;ctx.fill();
  }

  for(let i=bul.length-1;i>=0;i--){
    const b=bul[i];b.x+=b.vx;b.y+=b.vy;b.l--;
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fillStyle='#facc15';ctx.fill();
    if(b.l<=0)bul.splice(i,1);
  }

  for(let i=enm.length-1;i>=0;i--){
    const e=enm[i],a=Math.atan2(p.y-e.y,p.x-e.x);
    e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fillStyle=e.col;ctx.fill();

    for(let j=bul.length-1;j>=0;j--){
      if(Math.hypot(e.x-bul[j].x,e.y-bul[j].y)<e.r+4){e.hp-=p.dmg;bul.splice(j,1);break}
    }
    orbs.forEach(o=>{if(Math.hypot(e.x-o.x,e.y-o.y)<e.r+8)e.hp-=3});

    if(e.hp<=0){
      snd(110,'sawtooth',.09,.04);
      for(let k=0;k<7;k++)prt.push({x:e.x,y:e.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:18,c:e.col});
      gem.push({x:e.x,y:e.y,v:e.val});enm.splice(i,1);continue;
    }
    if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){p.hp-=.6;shk=5;hud()}
  }

  if(p.hp<=0){
    st='over';endJoy();snd(70,'sawtooth',.4,.15);
    sv.cn+=rc;if(rc>sv.best)sv.best=rc;
    localStorage.setItem('naSave2',JSON.stringify(sv));
    document.getElementById('endCn').innerText=rc;
    document.getElementById('revBtn').style.display=revUsed?'none':'inline-block';
    document.getElementById('mOver').classList.remove('hide');
  }

  for(let i=gem.length-1;i>=0;i--){
    const g=gem[i],d=Math.hypot(p.x-g.x,p.y-g.y);
    if(d<p.mag){const a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(a)*8;g.y+=Math.sin(a)*8}
    ctx.beginPath();ctx.arc(g.x,g.y,5,0,7);ctx.fillStyle='#4ade80';ctx.fill();
    if(d<22){
      p.xp+=15*g.v;rc+=g.v;gem.splice(i,1);snd(750,'sine',.05,.03);
      if(p.xp>=p.mxp){p.xp-=p.mxp;p.lvl++;p.mxp=Math.floor(p.mxp*1.3);lvlUp()}
      hud();
    }
  }

  for(let i=prt.length-1;i>=0;i--){
    const pt=prt[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.l--;
    ctx.fillStyle=pt.c;ctx.fillRect(pt.x,pt.y,3,3);
    if(pt.l<=0)prt.splice(i,1);
  }

  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=sv.cur;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();

  if(joy.on){
    ctx.beginPath();ctx.arc(joy.sx,joy.sy,36,0,7);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(joy.sx+joy.dx*24,joy.sy+joy.dy*24,14,0,7);ctx.fillStyle='rgba(56,189,248,.6)';ctx.fill();
  }
  ctx.restore();
}
drawSkins();loop();
</script>
</body>
</html>
